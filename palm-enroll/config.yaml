%YAML:1.0
---
# Relative paths are resolved against this file's directory.
# "(est.)" = estimate, not measured yet. Measurements: docs/measurements.md.
model:
  onnx: "../models/EE_PRnet-epoch-60.onnx"
  version: "ee_prnet_e60"   # stored in the gallery; change => re-enroll
  threads: 4                # physical cores
hand:
  palm_onnx: "../models/palm_detection_mediapipe_2023feb.onnx"
  landmark_onnx: "../models/handpose_estimation_mediapipe_2023feb.onnx"
template:
  min_valid: 3            # samples that must survive outlier removal
  outlier_cos_min: 0.5    # drop a sample whose cos to the medoid is below this
  dup_cos_max: 0.82       # refuse enrollment matching another person above this
match:
  accept_cos_min: 0.82    # best cos over a person's stored samples; 0 false accepts on 409 images
gallery: "gallery.db"
# Capture gate (capture_gate.h); checks run in the order listed.
capture:
  crop_scale: 1.17        # hand crop side / landmark box
  min_crop_frac: 0.33     # crop side / frame height
  max_motion: 0.02        # landmark motion per frame / crop side
  blur_min: 100           # Laplacian variance of the crop
  edge_margin: 0.02       # landmarks stay this fraction of the frame from the edge
  min_palm_frac: 0.15     # wrist -> middle knuckle / frame height; below = too far (est.)
  max_palm_frac: 0.30     # above = too close (est.)
  max_angle_deg: 35       # in-plane rotation from upright
  max_tilt_deg: 25        # out-of-plane palm tilt, every frame (EER 9.8% -> 2.3-2.9%)
  frontal_max_deg: 12     # enrollment: tilt limit of the first sample (est.)
  min_pose_sep_deg: 8     # enrollment: min angle between samples (tilt noise p90 5)
  min_finger_open: 0.6    # finger length / palm length; below = curled (est.)
  min_mean: 70            # palm gray level 0..255; below = too dark (est.)
  max_mean: 160           # above = too bright (est.)
  max_sat_frac: 0.05      # max share of palm pixels >= 250
  stable_ms: 400          # hold still at least this long ...
  stable_min_frames: 10   # ... and over at least this many frames
